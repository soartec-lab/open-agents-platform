# A stored user-created agent (packages/agent-backend/src/models/agent-config.ts).
# Served by the single `custom` flue agent at
# GET /agents/custom/{configId}__channel-{channelId} (read-only observation;
# writes go through POST /channels/{id}/messages).
title: AgentConfig
type: object
required: [id, name, instructions, createdAt]
properties:
  id:
    type: string
    description: Server-generated UUID (the `configId` half of the composite agent instance id).
  name:
    type: string
    description: >-
      Display name chosen by the end user. Unique across the catalog — it is
      the label the orchestrator's delegate tool and @mentions resolve
      against.
  instructions:
    type: string
    description: >-
      Free-form agent instructions written by the end user (applied as a
      lower-trust customization section under the operator hard rules).
  role:
    type: string
    description: Job-title label (e.g. "Researcher"); absent = no role set.
  createdAt:
    type: string
    description: Creation timestamp (ISO 8601).
example:
  id: 6f2c9c1e-0000-0000-0000-000000000000
  name: Researcher
  instructions: You research topics thoroughly and report concise findings.
  role: Research
  createdAt: "2026-08-07T12:00:00.000Z"
